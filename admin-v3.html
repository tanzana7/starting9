<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Starting9 自動運転V3</title>
  <link rel="stylesheet" href="admin-v3.css?v=independent-roster-lineup-safety-1-admin-player-scroll-picker-1">
</head>
<body>
  <main class="admin-v3-shell">
    <header class="admin-v3-header">
      <div class="admin-v3-brand">
        <p class="eyebrow">GAME AUTOMATION V3</p>
        <h1>自動運転V3</h1>
        <p class="muted">今日の試合を起点に、V3の運用状態を確認します。</p>
      </div>
      <div class="header-actions">
        <a id="adminLoginLink" href="index.html?auth=login&amp;returnTo=%2Fadmin-v3.html">ログイン画面</a>
        <a href="index.html">通常画面</a>
        <button id="refreshV3" type="button">全体を更新</button>
        <button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-controls="v3Navigation" aria-expanded="false">メニュー</button>
      </div>
    </header>
    <div class="admin-v3-layout">
      <aside id="v3Navigation" class="v3-sidebar" aria-label="V3管理メニュー">
        <nav class="v3-nav">
          <button type="button" data-v3-view="dashboard">ダッシュボード</button>
          <button type="button" data-v3-view="games">試合一覧</button>
          <button type="button" data-v3-view="workflow">試合進行</button>
          <button type="button" data-v3-view="lineup">スタメン</button>
          <button type="button" data-v3-view="roster">ロースター管理</button>
          <button type="button" data-v3-view="scoring">採点・ランキング</button>
          <button type="button" data-v3-view="ranking-reset">ランキング対象外</button>
          <button type="button" data-v3-view="schedule">日程管理</button>
          <button type="button" data-v3-view="add-game-preview">追加試合プレビュー</button>
          <button type="button" data-v3-view="diagnostics">診断・監査</button>
        </nav>
      </aside>
      <section class="admin-v3-main" aria-live="polite">
        <div class="v3-toolbar">
          <label for="v3GameFilter">試合</label>
          <select id="v3GameFilter">
            <option value="all">すべて</option>
            <option value="today">今日</option>
            <option value="tomorrow">明日</option>
            <option value="future">今後</option>
            <option value="past">過去</option>
          </select>
          <label for="v3GameSelect">対象試合</label>
          <select id="v3GameSelect" aria-label="対象試合"></select>
          <button id="refreshV3View" type="button">この画面を更新</button>
        </div>
        <div id="v3Status" class="status" role="status" aria-live="polite"></div>
        <section id="v3Schema" class="schema-panel"></section>
        <section id="v3View" class="v3-view" aria-live="polite"></section>
      </section>
    </div>
  </main>
  <script src="frontend/admin-v3/state.js?v=independent-roster-lineup-safety-1"></script>
  <script src="frontend/public/fighters-player-details.js?v=fighters-player-details-20260903-1"></script>
  <script src="frontend/public/player-display.js?v=public-player-display-1-batting-hand-player-number-1-player-details-1"></script>
  <script src="frontend/admin-v3/api-client.js?v=independent-roster-lineup-safety-1"></script>
  <script src="frontend/admin-v3/dom.js?v=manual-lineup-finalize-safety-1"></script>
  <script src="frontend/admin-v3/render-manual-lineup.js?v=independent-roster-lineup-safety-1-admin-player-scroll-picker-1"></script>
  <script src="frontend/admin-v3/render-manual-roster.js?v=independent-roster-lineup-safety-1-admin-player-scroll-picker-1"></script>
  <script src="frontend/admin-v3/render-game-progress.js?v=manual-lineup-finalize-safety-1"></script>
  <script src="frontend/admin-v3/render-job-details.js?v=admin-v3-v35-diagnostics-readability-1"></script>
  <script src="frontend/admin-v3/render-roster.js?v=admin-v3-v35-diagnostics-readability-1"></script>
  <script src="frontend/admin-v3/render-diagnostics.js?v=admin-v3-v35-diagnostics-readability-1-v4-ops"></script>
  <script src="frontend/admin-v3/render-ranking-reset.js?v=admin-v3-v35-diagnostics-readability-1"></script>
  <script src="frontend/admin-v3/render-perfect-score-preview.js?v=admin-v3-v35-diagnostics-readability-1"></script>
  <script src="frontend/admin-v3/render-manual-game-preview.js?v=admin-v3-v35-diagnostics-readability-1"></script>
  <script src="frontend/admin-v3/app-coordinator.js?v=independent-roster-lineup-safety-1-preserve-picker-scroll-1"></script>
  <script src="admin-v3.js?v=independent-roster-lineup-safety-1"></script>
</body>
</html>
