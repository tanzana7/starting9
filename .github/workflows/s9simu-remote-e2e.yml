name: S9simu Remote E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Remote operation scope
        required: true
        type: choice
        options:
          - admin-diagnose
          - admin-check
          - schedule-check
          - roster-only
          - job-only
          - sibling-check
          - fighters-rehearsal
          - prepare-unattended
          - full
        default: full

permissions:
  contents: read
  id-token: write

concurrency:
  group: s9simu-remote-e2e
  cancel-in-progress: false

jobs:
  remote-e2e:
    if: github.repository == 'tanzana7/starting9' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run one authorized remote simulation
        env:
          S9SIMU_MODE: ${{ inputs.mode }}
        run: node tooling/test-site/simu-e2e.mjs
