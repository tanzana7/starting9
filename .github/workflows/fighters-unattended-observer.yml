name: Fighters Unattended Automation Observer

# Read-only checkpoint checker. The chained driver observes every tick; this
# workflow stays for manual verification only.
on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Checkpoint to assert
        required: true
        type: choice
        options:
          - before_cutoff
          - after_cutoff
          - after_lineup
          - final

permissions:
  contents: read

concurrency:
  group: fighters-unattended-2026-10-25
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'tanzana7/starting9' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only checkpoint
        env:
          OBSERVER_CHECKPOINT: ${{ inputs.checkpoint }}
        run: node tooling/test-site/unattended-observer.mjs
