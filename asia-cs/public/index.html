<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting9 Asia CS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Starting9</p>
      <h1 id="competitionName">Asia CS</h1>
      <p id="testBanner" class="message hidden" role="status"></p>
      <p id="competitionMeta" class="muted">大会情報を読み込み中</p>
      <p id="competitionDescription"></p>
      <p id="authStatus" class="message" role="status">Starting9のログイン状態を確認中</p>
    </header>
    <section class="panel" aria-labelledby="nextGameTitle">
      <div class="section-heading"><h2 id="nextGameTitle">次の日本戦</h2><span id="acceptingCount" class="muted"></span></div>
      <div id="nextGame" class="game-highlight">大会情報を読み込み中</div>
    </section>
    <section class="panel" aria-labelledby="scheduleTitle">
      <div class="section-heading"><h2 id="scheduleTitle">日程</h2><span id="scheduleStatus" class="muted"></span></div>
      <div id="scheduleList" class="schedule-list"></div>
    </section>
    <section id="predictionPanel" class="panel hidden" aria-labelledby="predictionTitle">
      <div class="section-heading"><div><h2 id="predictionTitle">予想</h2><p id="gameMeta" class="muted"></p></div><span id="userStatus"></span></div>
      <p id="deadlineStatus" class="muted"></p>
      <form id="predictionForm">
        <label id="predictionTeamLabel">チーム<select id="predictionTeamId"></select></label>
        <div id="predictionLineup" class="lineup-grid"></div>
        <p id="predictionValidation" class="message" role="status" aria-live="polite"></p>
        <div class="actions"><button id="saveButton" type="submit" disabled>保存</button><button id="deleteButton" class="secondary" type="button" disabled>削除</button></div>
      </form>
      <p id="predictionMessage" class="message" role="status"></p>
    </section>
    <section class="panel" aria-labelledby="rankingTitle">
      <div class="section-heading"><h2 id="rankingTitle">大会ランキング</h2><span id="rankingStatus" class="muted"></span></div>
      <ol id="rankingList" class="ranking-list"></ol>
    </section>
    <section class="panel" aria-labelledby="bestNineTitle">
      <div class="section-heading"><h2 id="bestNineTitle">大会Best Nine</h2><span id="bestNineStatus" class="muted"></span></div>
      <ol id="bestNineList" class="ranking-list"></ol>
    </section>
    <section id="resultPanel" class="panel hidden" aria-labelledby="resultTitle">
      <div class="section-heading"><h2 id="resultTitle">試合結果</h2><span id="resultStatus" class="muted"></span></div>
      <div id="resultDetail"></div>
    </section>
    <p class="admin-link"><a href="./admin.html">管理画面</a></p>
  </main>
  <script type="module" src="./app.js?v=apbc-sequential-prediction-1" data-competition-id="apbc-2026"></script>
</body>
</html>
