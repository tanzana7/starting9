name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests and static checks
        run: npm run test:ci
      - name: Check for conflict markers
        shell: bash
        run: '! grep -RInE "^(<<<<<<<|=======|>>>>>>>)" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=scripts .'
